package_schema_version: "1.0.0"
confidence:
  method: paired_percentile_bootstrap
  level: 0.95
  resamples: 2000
  seed: 20260808
kpi_thresholds:
  macro_f1_min: 0.82
  macro_f1_improvement_min: 0.05
  acc_at_iou_min: 0.70
  acc_at_iou_improvement_min: 0.08
  json_validity_min: 0.99
  hard_negative_fpr_max: 0.10
  hard_negative_fpr_relative_reduction_min: 0.30
  consistency_min: 0.97
fixture_policy:
  eligible_for_model_acceptance: false
  required_cli_flag: fixture_only
mock_policy:
  eligible_for_model_acceptance: false
  required_cli_flag: mock_only
comparison:
  method: paired_percentile_bootstrap
  minimum_reliable_samples: 30
  small_sample_conclusion: degraded_small_sample
  multiple_comparison_correction: none
