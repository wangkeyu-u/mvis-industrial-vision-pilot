[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mvis"
version = "0.1.0"
description = "Lightweight multimodal visual grounding and structured QA system"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1",
  "typing-extensions>=4.12,<5",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.25,<1",
  "mlx-vlm>=0.2,<1",
]

[dependency-groups]
dev = [
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "scipy>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
